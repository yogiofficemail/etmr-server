services:
  - type: web
    name: etmr-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: etmr
      - key: CLIENT_ORIGIN
        value: "*"
